[project]
name = "ralsei"
version = "4.0.0.pre1"
description = "Build modular data pipelines running inside the postgres database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=25.1.0",
    "bidict>=0.23.1",
    "click>=8.1.8",
    "graphviz>=0.20.3",
    "jinja2>=3.1.5",
    "returns>=0.24.0",
    "rich>=13.9.4",
    "sqlalchemy>=2.0.37",
    "typer>=0.15.1",
]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
